version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_enterprise_password
      POSTGRES_DB: aegis_control_plane
    ports:
      - '5432:5432'
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis_control_plane']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6379:6379'
    volumes:
      - aegis_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  aegis-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-control-plane
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aegis:aegis_enterprise_password@postgres:5432/aegis_control_plane
      REDIS_URL: redis://redis:6379
      AEGIS_HMAC_SECRET: aegis-production-hmac-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  aegis_pgdata:
  aegis_redisdata:

